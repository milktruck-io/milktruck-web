# fly.toml app configuration file generated for milktruck-web on 2026-08-31T14:46:12Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'milktruck-web'
primary_region = 'iad'

[build]
  # Vite inlines this at BUILD time, so it has to be here (or a --build-arg),
  # not a runtime secret. Must match the trivia API's hostname, or players get
  # "Can't reach the game server".
  [build.args]
    VITE_TRIVIA_API_URL = "https://milktruck-api.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
